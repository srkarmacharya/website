name: Update dashboard data

on:
  schedule:
    # 06:47 UTC = 12:32 Nepal time, after NRB, FENEGOSIDA and Kalimati publish their daily figures
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      forex_from:
        description: 'Optional: backfill NRB exchange rates from this date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Fetch latest data
        id: fetch
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.forex_from }}" ]; then
            python scripts/update_data.py --forex-from "${{ github.event.inputs.forex_from }}"
          else
            python scripts/update_data.py
          fi

      - name: Copy the study plan note from the Obsidian vault
        # The vault is private, so this needs a read-only token saved as the
        # repository secret VAULT_TOKEN. Without it, the last copy is kept.
        continue-on-error: true
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          if [ -z "$VAULT_TOKEN" ]; then
            echo "::notice::No VAULT_TOKEN secret, so the study plan keeps its last copy."
            exit 0
          fi
          curl -fsSL \
            -H "Authorization: Bearer $VAULT_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/srkarmacharya/obsidian-vault/contents/Math%20study%20plan.md" \
            -o /tmp/math-plan.md
          if grep -q '^- \[' /tmp/math-plan.md; then
            mv /tmp/math-plan.md data/math-plan.md
          else
            echo "::warning::The study plan note had no checklist lines, so it was not copied."
          fi

      - name: Commit changes
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: daily update $(TZ=Asia/Kathmandu date +%F)"
            git push
          fi

      - name: Report failed sources
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::One or more data sources failed. See the 'Fetch latest data' step log. Other sources were still saved."
          exit 1
